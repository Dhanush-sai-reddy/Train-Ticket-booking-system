version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: railrover-postgres
    environment:
      POSTGRES_DB: railrover
      POSTGRES_USER: railrover_user
      POSTGRES_PASSWORD: railrover_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - railrover-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railrover_user -d railrover"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: railrover-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://railrover_user:railrover_password@postgres:5432/railrover?schema=public
      JWT_SECRET: your-super-secret-jwt-key
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - railrover-network
    command: npm run dev

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: railrover-frontend
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - railrover-network
    command: npm run dev

volumes:
  postgres_data:

networks:
  railrover-network:
    driver: bridge
